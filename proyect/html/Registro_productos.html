<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Producto</title>
  <link rel="stylesheet" href="../css/Registro_productos.css" />
  <link rel="stylesheet" href="../css/media.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
</head>
<body>
<!-- Registro completo en una sola página -->
  <div class="pagina">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>
    <div class="circle circle-5"></div>
    <div class="circle circle-6"></div>
 
    <div class="contenedor">
      <h1 class="title">Registro de Producto</h1>
      <p class="subtitle">Registra tu producto en el formulario a continuación:</p>
 
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" />
      </div>
 
      <div class="form-group">
        <label>Apellido:</label>
        <input type="text" />
      </div>
 
      <div class="form-group">
        <label>Correo:</label>
        <input type="text" />
      </div>
 
      <div class="form-group">
        <label>Dirección:</label>
        <input type="text" />
      </div>
 
      <div class="form-row">
        <div class="form-group half">
          <label>Ciudad:</label>
          <input type="text" />
        </div>
        <div class="form-group half">
          <label>Código postal</label>
          <input type="text" />
        </div>
      </div>
 
      <h2 class="title underline section-title">Información de Producto</h2>
 
      <div class="form-group">
        <label>Nombre del modelo</label>
        <input type="text" />
      </div>
 
      <div class="form-group">
        <label>Comprado desde:</label>
        <div class="select-wrapper">
          <select>
            <option value=""></option>
            <option value="tienda">Tienda física</option>
            <option value="online">Tienda en línea</option>
          </select>
        </div>
      </div>
 
      <div class="form-group">
        <label>Fecha de compra:</label>
        <div class="input-icon-wrapper">
          <input type="date" />
        </div>
      </div>
 
      <div class="btn-wrapper">
        <button class="btn-registrar">Registrar</button>
      </div>
    </div>
  </div>
 
</body>
</html>
