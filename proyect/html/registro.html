<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registrase </title>

    <!-- css -->
    <link rel="stylesheet" href="../css/Inicio_secion.css">
    <link rel="stylesheet" href="../css/media.css">

</head>
<body>
    <div class="container">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
            <div class="circle circle-4"></div>
            <div class="circle circle-5"></div>
            <div class="circle circle-6"></div>
            <div class="circle circle-7"></div>
            <div class="circle circle-8"></div>
            <div class="circle circle-9"></div>
            <div class="circle circle-10"></div>

            <div class="logo-ico-container">
                <div class="icono">
                    <img src="../imagenes/icono.png" alt="icono usuario">
                </div>
            </div>

            <h1 class="title">Registrarse</h1>

            <div class="register-row">
                <p class="no-account">¿Ya tienes cuenta?</p>
                <a class="register-link" href="iniciar_sesion.html">Inicia Sesión</a>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <input type="email" id="Correo" name="Correo" placeholder=" " required autocomplete="email" minlength="10" maxlength="50" title="Ingresa un correo válido">
                    <label for="Correo">Correo</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder=" " required autocomplete="new-password" minlength="8" maxlength="20" title="La contraseña debe tener mínimo 8 caracteres">
                    <label for="password">Contraseña</label>
                </div>
                <button type="submit" class="btn-acceder">Registrarse</button>
            </form>
        </div>
    </body>
</html>
